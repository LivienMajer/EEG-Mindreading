"""Config for the full pipeline. Adjust once data format is known."""

data:
  sfreq: 500            # confirmed: 500 Hz, 17 ch, 1500 samples (3 s) per trial
  filter:
    l_freq: 0.5
    h_freq: 45.0
  artifact_threshold_uv: null    # data is pre-normalized (std~0.5/ch), no µV rejection
  time_window: [5, 60]           # samples @ 100 Hz after decimation = 50-600 ms
                                # (organizer baseline window, early visual responses)
  decimate: 5                    # 500 -> 100 Hz via FIR zero-phase decimate

features:
  bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
    gamma: [30, 45]
  high_gamma: [45, 90]   # possible at 500 Hz - test whether it carries signal

model:
  ridge_alpha: 10.0

training:
  sfreq: 500
  decimate: 5
  time_window: [5, 60]   # samples @ 100 Hz = 50-600 ms post-onset
  embed_dim: 512
  batch_size: 64
  epochs: 50
  lr: 0.0003
  temperature: 0.07
  filter:
    l_freq: 0.5
    h_freq: 45.0
  device: cpu             # set to cuda if GPU available
  model_path: models/eeg_encoder.pt

video:
  model: ViT-B-32
  pretrained: openai
  n_frames: 8
