"""Config for the full pipeline. Adjust once data format is known."""

data:
  sfreq: 500            # confirmed: 500 Hz, 17 ch, 1500 samples (3 s) per trial
  # NO bandpass/highpass recommended for this dataset - empirical d' probe
  # (src/snr_probe.py) shows raw data maximizes cross-subject identifiability.
  # The 46 Hz peak is broadband stimulus-locked (gamma), not line noise:
  # notch filtering it out reduced d' to 0 in probe tests.
  filter: null          # keep raw; decimate with zero-phase FIR for speed only
  artifact_rejection: none    # data pre-normalized (std~0.5/ch), clean
  decimate: 5                    # 500 -> 100 Hz via FIR zero-phase
  time_window: [5, 35]           # samples @ 100 Hz = 50-350 ms post-onset
                                # (+30% d' over organizer's 50-600 ms window,
                                #  consistent across all 9 subject pairs)

features:
  bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
    gamma: [30, 45]
  high_gamma: [45, 90]   # possible at 500 Hz - test whether it carries signal

model:
  ridge_alpha: 10.0

training:
  sfreq: 500
  decimate: 5
  time_window: [5, 60]   # samples @ 100 Hz = 50-600 ms post-onset
  embed_dim: 512
  batch_size: 64
  epochs: 50
  lr: 0.0003
  temperature: 0.07
  filter:
    l_freq: 0.5
    h_freq: 45.0
  device: cpu             # set to cuda if GPU available
  model_path: models/eeg_encoder.pt

video:
  model: ViT-B-32
  pretrained: openai
  n_frames: 8
